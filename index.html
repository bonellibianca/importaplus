    class PosicionArancelariaBE {
      constructor({

        capitulo = '',
        aec = 0,
        arancelExternoComun = 0,
        tipoBien = 'GENERAL',
        esBienDeCapital = false,
        esInformaticaTelecom = false,
        ivaAlicuota = 21.0,
        poseeExcepcion = false,
        anexoExcepcion = '',
        arancelExcepcion = 0,
        arancelAplicableExcepcion = 0,
        condicionExcepcion = ''
      } = {}) {
        this.codigoNcm = codigoNcm;
        this.descripcion = descripcion;
        this.categoria = categoria;
        this.capitulo = capitulo;
        this.aec = parseFloat(aec ?? arancelExternoComun) || 0;
        this.arancelExternoComun = this.aec;
        this.tipoBien = tipoBien || (esBienDeCapital ? 'BK' : (esInformaticaTelecom ? 'BIT' : 'GENERAL'));
        this.esBienDeCapital = Boolean(esBienDeCapital || this.tipoBien === 'BK');
        this.esInformaticaTelecom = Boolean(esInformaticaTelecom || this.tipoBien === 'BIT');
        this.ivaAlicuota = (this.esBienDeCapital || this.esInformaticaTelecom) ? 10.5 : (parseFloat(ivaAlicuota) || 21.0);
        this.poseeExcepcion = Boolean(poseeExcepcion);
        this.anexoExcepcion = anexoExcepcion || '';
        this.arancelExcepcion = parseFloat(arancelExcepcion ?? arancelAplicableExcepcion) || 0;
        this.arancelAplicableExcepcion = this.arancelExcepcion;
        this.condicionExcepcion = condicionExcepcion || '';

    }

    /*************************************************************************
     * 2. CAPA DAL (Data Access Layer - Catálogos de NCM y Países)
     *************************************************************************/
    class PosicionArancelariaDAL {
      constructor() {
        this._cachePosiciones = null;
        this.fuenteDatos = '';
      }

      async cargarCatalogo() {
        if (this._cachePosiciones && this._cachePosiciones.length > 0) {
          return this._cachePosiciones;
        }

        // Carga desde SheetJS si se sirve por HTTP
        if (typeof XLSX !== 'undefined' && window.location.protocol.startsWith('http')) {
          try {
            const resp = await fetch('./Nomenclatura_NCM_aranceles.xlsx');
            if (resp.ok) {
              const buf = await resp.arrayBuffer();
              const wb = XLSX.read(buf, { type: 'array' });
              const sheetName = wb.SheetNames.find(n => n.toLowerCase().includes('nomenclatura')) || wb.SheetNames[1] || wb.SheetNames[0];
              const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { defval: '' });
              if (rows && rows.length > 0) {
                this._cachePosiciones = rows.map(r => {
                  const code = String(r['Código NCM'] || '').trim();
                  const desc = String(r['Descripción completa'] || r['Descripción'] || '').trim();
                  const aec = parseFloat(r['Arancel AEC (%)']) || 0;
                  const tipo = String(r['Tipo'] || '').trim();
                  const anexo = String(r['Anexo excepción'] || '').trim();
                  const aplicable = r['Arancel aplicable (%)'] !== '' ? parseFloat(r['Arancel aplicable (%)']) : aec;
                  const cond = String(r['Condición'] || '').trim();
                  return new PosicionArancelariaBE({
                    codigoNcm: code,
                    descripcion: desc,
                    categoria: desc.includes(' > ') ? desc.split(' > ')[0] : 'Capítulo ' + code.slice(0, 2),
                    capitulo: code.slice(0, 2),
                    aec: aec,
                    tipoBien: tipo || 'GENERAL',
                    esBienDeCapital: tipo === 'BK',
                    esInformaticaTelecom: tipo === 'BIT',
                    poseeExcepcion: Boolean(anexo),
                    anexoExcepcion: anexo ? 'Decreto 557/2023 - Anexo ' + anexo : '',
                    arancelExcepcion: aplicable,
                    condicionExcepcion: cond
                  });
                }).filter(p => p.codigoNcm.length > 0);
                this.fuenteDatos = `Excel directo (${this._cachePosiciones.length} NCM)`;
                return this._cachePosiciones;
              }
            }
          } catch (e) {}
        }

        // Carga de alta velocidad desde datos_excels.js
        if (window.EXCEL_NCM_DATA && Array.isArray(window.EXCEL_NCM_DATA)) {
          this._cachePosiciones = window.EXCEL_NCM_DATA.map(item => new PosicionArancelariaBE({
            codigoNcm: item.c,
            descripcion: item.d,
            categoria: item.cat,
            capitulo: item.cap,
            aec: item.aec,
            tipoBien: item.t || 'GENERAL',
            esBienDeCapital: item.t === 'BK',
            esInformaticaTelecom: item.t === 'BIT',
            poseeExcepcion: Boolean(item.ax),
            anexoExcepcion: item.ax ? 'Decreto 557/2023 - Anexo ' + item.ax : '',
            arancelExcepcion: item.ap,
            condicionExcepcion: item.co
          }));
          this.fuenteDatos = `Excels oficiales NCM (${this._cachePosiciones.length} registros)`;
          return this._cachePosiciones;
        }

        this._cachePosiciones = [];
        return this._cachePosiciones;
      }

      async obtenerTodas() {
        return await this.cargarCatalogo();
      }

      async obtenerPorCodigo(codigoNcm) {
        const lista = await this.cargarCatalogo();
        const limpio = (codigoNcm || '').trim().replace(/[.\s-]/g, '');
        return lista.find(p => p.codigoNcm.replace(/[.\s-]/g, '') === limpio) || null;
      }

      async buscarPorTermino(texto, limite = 12) {
        const lista = await this.cargarCatalogo();
        if (!texto || !texto.trim()) return [];

        const rawTerm = texto.trim().toLowerCase();
        const cleanNum = rawTerm.replace(/[.\s-]/g, '');

        const sinonimos = {
          'notebook': '8471.30',
          'laptop': '8471.30',
          'computadora': '8471.',
          'pc': '8471.41',
          'celular': '8517.13',
          'smartphone': '8517.13',
          'telefono': '8517.1',
          'router': '8517.62',
          'remera': '6109.10',
          'camiseta': '6109.',
          'zapatilla': '6402.19',
          'calzado': '6402.',
          'juguete': '9503.00',
          'consola': '9504.50',
          'monitor': '8528.52',
          'auricular': '8518.30',
          'termo': '9617.00',
          'perfume': '3303.00',
          'cafe': '0901.21',
          'autoparte': '8708.'
        };

        let ncmHint = null;
        for (const [k, v] of Object.entries(sinonimos)) {
          if (rawTerm.includes(k)) {
            ncmHint = v;
            break;
          }
        }

        const palabras = rawTerm.split(/\s+/).filter(Boolean);
        const resultados = [];

        for (let i = 0; i < lista.length; i++) {
          const pos = lista[i];
          const descLower = pos.descripcion.toLowerCase();
          const ncmClean = pos.codigoNcm.replace(/[.\s-]/g, '');

          const coincideCodigo = cleanNum.length >= 2 && (pos.codigoNcm.toLowerCase().includes(rawTerm) || ncmClean.includes(cleanNum));
          const coincideHint = ncmHint && pos.codigoNcm.startsWith(ncmHint);
          const coincideTexto = palabras.every(w => descLower.includes(w));

          if (coincideCodigo || coincideHint || coincideTexto) {
            resultados.push(pos);
            if (resultados.length >= limite * 3) break;
          }
        }

        resultados.sort((a, b) => {
          if (ncmHint) {
            const aH = a.codigoNcm.startsWith(ncmHint) ? 0 : 1;
            const bH = b.codigoNcm.startsWith(ncmHint) ? 0 : 1;
            if (aH !== bH) return aH - bH;
          }
          if (a.codigoNcm.startsWith(rawTerm) && !b.codigoNcm.startsWith(rawTerm)) return -1;
          if (!a.codigoNcm.startsWith(rawTerm) && b.codigoNcm.startsWith(rawTerm)) return 1;
          return 0;
        });

        return resultados.slice(0, limite);
      }
    }

      }

    /*************************************************************************
     * 3. CAPA BLL (Business Logic Layer - Patrón Template Method)
     *************************************************************************/
    class PosicionArancelariaBLL {
      constructor(posicionDAL = new PosicionArancelariaDAL()) {
        this.posicionDAL = posicionDAL;
      }

      async buscarPosiciones(texto, limite = 12) {
        return await this.posicionDAL.buscarPorTermino(texto, limite);
      }

    class PaisBLL {
      constructor(paisDAL = new PaisDAL()) {
        this.paisDAL = paisDAL;
      }

      async obtenerPaises() {
        return await this.paisDAL.obtenerPaises();
      }

      estimarFleteYSeguro(fobTotal, pais) {
        const pctFlete = pais ? (pais.fleteEstimadoPct || 8.0) : 8.0;
        const fleteCalculado = +(Math.max(50, fobTotal * (pctFlete / 100))).toFixed(2);
        const pctSeguro = pais ? (pais.seguroPctStd || 1.0) : 1.0;
        const seguroCalculado = +(Math.max(10, fobTotal * (pctSeguro / 100))).toFixed(2);
        return { flete: fleteCalculado, seguro: seguroCalculado };
      }
    }

    class CalculadorAduaneroTemplate {
      liquidarTemplate(be, parametros) {
        this.calcularFob(be);
        this.calcularFleteYSeguro(be);
        this.calcularCif(be);
        this.determinarDerechosImportacion(be, parametros);
        this.calcularTasaEstadistica(be, parametros);
        this.calcularBaseImponibleInterior(be);
        this.calcularImpuestosInteriores(be, parametros);
        this.calcularCargosFijos(be, parametros);
        this.consolidarTotales(be, parametros);
        return be;
      }

      calcularFob(be) {
        be.fobTotal = +(be.cantidad * be.precioFobUnitario).toFixed(2);
      }

      calcularFleteYSeguro(be) {
        if (be.esEstimacionFlete) {
          const pctFlete = be.pais ? (be.pais.fleteEstimadoPct || 8.0) : 8.0;
          be.flete = +(Math.max(50, be.fobTotal * (pctFlete / 100))).toFixed(2);
        }
        be.fleteUsd = be.flete;

        if (be.esEstimacionSeguro) {
          const pctSeguro = be.pais ? (be.pais.seguroPctStd || 1.0) : 1.0;
          be.seguro = +(Math.max(10, be.fobTotal * (pctSeguro / 100))).toFixed(2);
        }
        be.seguroUsd = be.seguro;
      }

      calcularCif(be) {
        be.cifAduanero = +(be.fobTotal + be.flete + be.seguro).toFixed(2);
        be.cifUsd = be.cifAduanero;
      }

      determinarDerechosImportacion(be, parametros) {
        throw new Error('Debe implementarse en la subclase');
      }

      calcularTasaEstadistica(be, parametros) {
        if (be.pais.esIntrazona || be.posicion.esBienDeCapital) {
          be.alicuotaEstadistica = 0.0;
          be.montoEstadistica = 0.0;
          return;
        }
        const alicuota = parametros.tasaEstadisticaPct || 3.0;
        be.alicuotaEstadistica = alicuota;
        const tasaBruta = +(be.cifAduanero * (alicuota / 100)).toFixed(2);

        // Topes Legales Decreto 99/2019
        let topeMaximo = 150000;
        if (be.cifAduanero < 10000) topeMaximo = 180;
        else if (be.cifAduanero < 100000) topeMaximo = 3000;
        else if (be.cifAduanero < 1000000) topeMaximo = 30000;

        be.montoEstadistica = +(Math.min(tasaBruta, topeMaximo)).toFixed(2);
      }

      calcularBaseImponibleInterior(be) {
        be.baseImponibleInterior = +(be.cifAduanero + be.montoDie + be.montoEstadistica).toFixed(2);
      }

      calcularImpuestosInteriores(be, parametros) {
        const esReducido = be.posicion.esBienDeCapital || be.posicion.esInformaticaTelecom;
        be.alicuotaIva = esReducido ? parametros.ivaReducidoBKPct : parametros.ivaGeneralPct;
        be.montoIva = +(be.baseImponibleInterior * (be.alicuotaIva / 100)).toFixed(2);

        be.alicuotaIvaAdicional = esReducido ? parametros.percepcionIvaReducidoPct : parametros.percepcionIvaGeneralPct;
        be.montoIvaAdicional = +(be.baseImponibleInterior * (be.alicuotaIvaAdicional / 100)).toFixed(2);

        be.alicuotaGanancias = be.esInscriptoGanancias
          ? parametros.percepcionGananciasGeneralPct
          : parametros.percepcionGananciasNoCatPct;
        be.montoGanancias = +(be.baseImponibleInterior * (be.alicuotaGanancias / 100)).toFixed(2);
      }

      calcularCargosFijos(be, parametros) {
        be.arancelSim = parametros.arancelSimFijoUSD;
        be.digitalizacionSim = parametros.digitalizacionFijaUSD;
        be.totalSimDigitalizacion = parametros.totalSimDigitalizacionUSD;
      }

      consolidarTotales(be, parametros) {
        be.totalGravamenes = +(
          be.montoDie +
          be.montoEstadistica +
          be.montoIva +
          be.montoIvaAdicional +
          be.montoGanancias +
          be.totalSimDigitalizacion
        ).toFixed(2);

        be.costoTotalNacionalizado = +(be.cifAduanero + be.totalGravamenes).toFixed(2);
        be.costoUnitarioNacionalizado = +(be.costoTotalNacionalizado / be.cantidad).toFixed(2);
        be.ratioSobrecostoPct = be.fobTotal > 0
          ? +(((be.costoTotalNacionalizado - be.fobTotal) / be.fobTotal) * 100).toFixed(1)
          : 0;

        be.cotizacionBna = parametros.cotizacionOficialBNA;
        be.costoTotalARS = +(be.costoTotalNacionalizado * be.cotizacionBna).toFixed(2);

        const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
        let hash = 'IMP-2026-';
        for (let i = 0; i < 6; i++) hash += chars.charAt(Math.floor(Math.random() * chars.length));
        be.hashCotizacion = hash;

        be._desglose = [];
        be.agregarGravamen(new GravamenItemBE({
          tipoGravamen: 'Derecho de Importación (DIE)',
          baseImponible: be.cifAduanero,
          alicuota: be.alicuotaDie,
          montoUsd: be.montoDie,
          descripcion: be.tratamientoArancelario
        }));
        be.agregarGravamen(new GravamenItemBE({
          tipoGravamen: 'Tasa de Estadística Aduanera',
          baseImponible: be.cifAduanero,
          alicuota: be.alicuotaEstadistica,
          montoUsd: be.montoEstadistica,
          descripcion: (be.pais.esIntrazona || be.posicion.esBienDeCapital)
            ? 'Exento (0%) Mercosur / Bien de Capital (BK)'
            : '3% s/ CIF con escala de topes legales (Decreto 99/2019)'
        }));
        be.agregarGravamen(new GravamenItemBE({
          tipoGravamen: `IVA Aduanero DGA (${be.alicuotaIva}%)`,
          baseImponible: be.baseImponibleInterior,
          alicuota: be.alicuotaIva,
          montoUsd: be.montoIva,
          descripcion: (be.posicion.esBienDeCapital || be.posicion.esInformaticaTelecom)
            ? 'Alícuota reducida 10.5% Bienes de Capital (BK) / Informática (BIT)'
            : 'Alícuota general 21% s/ Base Imponible Interior'
        }));
        be.agregarGravamen(new GravamenItemBE({
          tipoGravamen: `Percepción IVA Adicional (${be.alicuotaIvaAdicional}%)`,
          baseImponible: be.baseImponibleInterior,
          alicuota: be.alicuotaIvaAdicional,
          montoUsd: be.montoIvaAdicional,
          descripcion: 'Régimen de percepción aduanera RG AFIP 2281'
        }));
        be.agregarGravamen(new GravamenItemBE({
          tipoGravamen: `Percepción Imp. a las Ganancias (${be.alicuotaGanancias}%)`,
          baseImponible: be.baseImponibleInterior,
          alicuota: be.alicuotaGanancias,
          montoUsd: be.montoGanancias,
          descripcion: be.esInscriptoGanancias
            ? '6% Responsable Inscripto (RG AFIP 2281)'
            : '11% Sujeto No Categorizado / Consumo Particular'
        }));
        be.agregarGravamen(new GravamenItemBE({
          tipoGravamen: 'Arancel SIM + Digitalización',
          baseImponible: be.totalSimDigitalizacion,
          alicuota: 0,
          montoUsd: be.totalSimDigitalizacion,
          descripcion: 'Cargo fijo Sistema Informático Malvina (USD 28) + Digitalización (USD 10)'
        }));
      }
    }

    class LiquidacionIntrazonaBLL extends CalculadorAduaneroTemplate {
      determinarDerechosImportacion(be) {
        be.tratamientoArancelario = 'Intrazona Mercosur (ACE 18 - Exento 0% DIE)';
        be.alicuotaDie = 0.0;
        be.montoDie = 0.0;
      }
    }

    class LiquidacionExtrazonaGeneralBLL extends CalculadorAduaneroTemplate {
      determinarDerechosImportacion(be) {
        be.tratamientoArancelario = 'Extrazona — Arancel Externo Común (AEC)';
        be.alicuotaDie = be.posicion.arancelExternoComun;
        be.montoDie = +(be.cifAduanero * (be.alicuotaDie / 100)).toFixed(2);
      }
    }

    class LiquidacionExcepcionArancelariaBLL extends CalculadorAduaneroTemplate {
      determinarDerechosImportacion(be) {
        be.tratamientoArancelario = `Excepción Arancelaria (${be.posicion.anexoExcepcion || 'Decreto 557/2023'})`;
        be.alicuotaDie = be.posicion.arancelAplicableExcepcion;
        be.montoDie = +(be.cifAduanero * (be.alicuotaDie / 100)).toFixed(2);
      }
    }

    class CalculadoraArancelariaBLL {
      constructor(calculadoraDAL = new CalculadoraArancelariaDAL()) {
        this.calculadoraDAL = calculadoraDAL;
      }

      validar(be) {
        if (!be) throw new Error('La entidad CalculadoraArancelariaBE es requerida.');
        if (!be.posicion) throw new Error('Debe seleccionar una posición arancelaria NCM.');
        if (!be.pais) throw new Error('Debe seleccionar un país de origen.');
        if (be.cantidad <= 0) throw new Error('La cantidad debe ser mayor a cero.');
        if (be.precioFobUnitario <= 0) throw new Error('El valor FOB unitario debe ser mayor a cero.');
        return true;
      }

      obtenerTemplateLiquidacion(be) {
        if (be.pais.esIntrazona) return new LiquidacionIntrazonaBLL();
        if (be.aplicarExcepcion && be.posicion.poseeExcepcion) return new LiquidacionExcepcionArancelariaBLL();
        return new LiquidacionExtrazonaGeneralBLL();
      }

      async liquidar(be) {
        this.validar(be);
        const parametros = await this.calculadoraDAL.obtenerParametrosRegulatorios();
        const template = this.obtenerTemplateLiquidacion(be);
        template.liquidarTemplate(be, parametros);
        return be;
      }
    }

     * 5. CONTROLADOR PRINCIPAL: SimuladorController (Context del Patrón STATE)
     *************************************************************************/
    class SimuladorController {
      constructor() {
        this.paisBLL = new PaisBLL();
        this.posicionBLL = new PosicionArancelariaBLL();
        this.calculadoraBLL = new CalculadoraArancelariaBLL();

        // Estados registrados (Exclusivamente PN1)
        this.states = {
          hero: new HeroState(),
          form: new FormularioState(),
          results: new ResultadosState(),
          breakdown: new DesgloseState()
        };
        this.currentState = this.states['hero'];

        this.state = {
          view: 'hero',
          form: {
            producto: '',
            paisOrigen: 'China',
            cantidad: '100',
            precioUnidad: '50.00',
            flete: '240',
            seguro: '10',
            condicionGanancias: 'inscripto'
          },
          posicionSeleccionada: null,
          aplicarExcepcion: true,
          paisesCatalogo: [],
          calculadoraBE: null
        };
      }

      async inicializar() {
        try {
          this.state.paisesCatalogo = await this.paisBLL.obtenerPaises();
          const catalogo = await this.posicionBLL.obtenerTodas();
          if (catalogo && catalogo.length > 0) {
            // Posición por defecto: Notebooks 8471.30.12 o la primera
            const inicial = await this.posicionBLL.obtenerPorCodigo('8471.30.12') || catalogo[0];
            if (inicial) {
              this.state.posicionSeleccionada = inicial;
              this.state.form.producto = `${inicial.codigoNcm} — ${inicial.descripcion}`;
            }
          }
        } catch (e) {
          console.warn('Error inicializando catálogos:', e);
        }
        this.render();
      }

      setView(newView) {
        this.state.view = newView;
        this.currentState = this.states[newView] || this.states['hero'];
        window.scrollTo({ top: 0, behavior: 'smooth' });
        this.render();
        if (this.currentState.onEnter) {
          this.currentState.onEnter(this);
        }
      }

      render() {
        const app = document.getElementById('app');
        if (!app || !this.currentState) return;
        app.innerHTML = this.currentState.render(this);
        if (this.currentState.bindEvents) {
          this.currentState.bindEvents(this);
        }
      }

      formatNumber(num) {
        const val = parseFloat(num) || 0;
        return val.toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      }

      seleccionarNCM(idx) {
        if (window._ncmCache && window._ncmCache[idx]) {
          this.state.posicionSeleccionada = window._ncmCache[idx];
          this.state.form.producto = `${this.state.posicionSeleccionada.codigoNcm} — ${this.state.posicionSeleccionada.descripcion}`;
          const dropdown = document.getElementById('ncm-dropdown');
          if (dropdown) dropdown.classList.add('hidden');
          this.render();
        }
      }

      actualizarSubtotalEnVivo() {
        const cant = parseInt(this.state.form.cantidad) || 0;
        const precio = parseFloat(this.state.form.precioUnidad) || 0;
        const subtotal = cant * precio;
        const subtotalEl = document.querySelector('.tabular-nums');
        if (subtotalEl) {
          subtotalEl.textContent = 'USD ' + this.formatNumber(subtotal);
        }
      }

      estimarLogistica() {
        const cant = parseInt(this.state.form.cantidad) || 1;
        const precio = parseFloat(this.state.form.precioUnidad) || 0;
        const fob = cant * precio;
        const pais = this.state.paisesCatalogo.find(p => p.nombre.toLowerCase().includes(this.state.form.paisOrigen.toLowerCase())) || this.state.paisesCatalogo[0];
        const est = this.paisBLL.estimarFleteYSeguro(fob, pais);
        this.state.form.flete = est.flete.toString();
        this.state.form.seguro = est.seguro.toString();
        this.render();
      }

      async ejecutarLiquidacion() {
        try {
          if (!this.state.posicionSeleccionada) {
            alert('Por favor seleccione una posición arancelaria NCM.');
            return;
          }
          const f = this.state.form;
          const pais = this.state.paisesCatalogo.find(p => p.nombre.toLowerCase().includes(f.paisOrigen.toLowerCase())) || this.state.paisesCatalogo[0];

          const be = new CalculadoraArancelariaBE({
            posicion: this.state.posicionSeleccionada,
            cantidad: parseInt(f.cantidad) || 1,
            precioFobUnitario: parseFloat(f.precioUnidad) || 0,
            pais: pais,
            flete: parseFloat(f.flete) || 0,
            seguro: parseFloat(f.seguro) || 0,
            esInscriptoGanancias: f.condicionGanancias === 'inscripto',
            aplicarExcepcion: this.state.aplicarExcepcion
          });

          this.state.calculadoraBE = await this.calculadoraBLL.liquidar(be);
          this.setView('results');
        } catch (err) {
          alert('Error al calcular liquidación: ' + err.message);
        }
      }
    }

    // Inicialización al cargar el DOM
    document.addEventListener('DOMContentLoaded', () => {
      window.app = new SimuladorController();
      window.app.inicializar();
    });
  </script>
</body>
</html>
